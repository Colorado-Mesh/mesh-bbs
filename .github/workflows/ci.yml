name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Lint, types, and distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: quality
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: shellcheck install.sh
      # Hatchling is in the locked dev group; do not resolve a new build environment.
      - run: uv run --no-sync python -m hatchling build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  core:
    name: Core and wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-15
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: core-${{ matrix.python }}
      - name: Prepare Intel Mac crypto source build
        if: matrix.os == 'macos-15-intel'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          openssl_prefix=$(brew --prefix openssl@3)
          if [ ! -f "$openssl_prefix/include/openssl/ssl.h" ]; then
            brew install openssl@3
          fi
          printf 'OPENSSL_DIR=%s\n' "$openssl_prefix" >> "$GITHUB_ENV"
          rustc --version
      - run: uv sync --locked --group dev
      - name: Test without optional protocol libraries
        run: uv run --no-sync pytest -q -m 'not integration'
      - name: Install with native crypto and all protocol extras
        if: matrix.os == 'macos-15-intel'
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/mesh-bbs-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mesh-bbs-bin
        run: |
          sh install.sh --no-setup --ref "$GITHUB_SHA"
          "$UV_TOOL_BIN_DIR/mesh-bbs" --help

  protocols:
    name: Optional protocols and isolated Reticulum
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: all-protocols
      - run: uv sync --locked --all-extras --group dev
      - name: Verify optional packages are installed
        run: uv run --no-sync python -c 'import RNS, LXMF, meshcore, meshtastic'
      - name: Adapter contracts, radio emulators, and Reticulum integration
        run: >-
          uv run --no-sync pytest -q
          tests/test_radio_adapters.py tests/test_reticulum_adapter.py tests/integration
